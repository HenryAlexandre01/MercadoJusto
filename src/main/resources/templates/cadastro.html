<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercadoJusto - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Novo Produto</h1>
    
    <form th:action="@{/produto/salvar}" th:object="${produto}" method="post" enctype="multipart/form-data" class="mt-4">
        
        <div class="mb-3">
            <label class="form-label">Nome:</label>
            <input type="text" th:field="*{nome}" class="form-control">
            <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Preço:</label>
            <input type="number" step="0.01" th:field="*{preco}" class="form-control">
            <div th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Estabelecimento:</label>
            <select th:field="*{estabelecimento.id}" class="form-control" required>
                <option value="" disabled selected>Selecione um mercado</option>
                <option th:each="est : ${estabelecimentos}" 
                        th:value="${est.id}" 
                        th:text="${est.nomeLoja}">
                </option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Salvar Produto</button>
        <a href="/" class="btn btn-secondary">Voltar</a>
    </form>
</body>
</html>
