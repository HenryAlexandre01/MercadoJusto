<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fcfcfc; }
        .sidebar { min-height: 100vh; background-color: #ffffff; border-right: 1px solid #e0e0e0; }
    </style>
</head>
<body>

    <div class="d-flex">
        <nav class="sidebar p-4" style="width: 250px;">
            <h4 class="text-success mb-4 fw-bold">MercadoJusto</h4>
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a class="nav-link text-dark" href="/">⬅ Voltar para Início</a></li>
            </ul>
        </nav>

        <main class="flex-grow-1 p-5">
            <h2 class="mb-4" th:text="${nomeProduto}">Nome do Produto</h2>
            
            <div class="card p-4 mb-4 border-0 shadow-sm">
                <h4>Estatísticas Gerais</h4>
                <div class="d-flex gap-5 mt-3">
                    <div>
                        <p class="text-muted">Preço Médio</p>
                        <strong class="fs-3" th:text="'R$ ' + ${#numbers.formatDecimal(media, 1, 2)}"></strong>
                    </div>
                    <div>
                        <p class="text-muted">Menor Preço</p>
                        <strong class="fs-3 text-success" th:text="'R$ ' + ${#numbers.formatDecimal(menorPreco, 1, 2)}"></strong>
                    </div>
                </div>
            </div>

            <table class="table table-hover bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Estabelecimento</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${produtos}">
                        <td th:text="${p.nome}"></td> <td th:text="'R$ ' + ${p.preco}"></td>
                        <td><a href="#" class="btn btn-outline-success btn-sm">Ver rota</a></td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
