<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercadoJusto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Novo Produto</h1>
    
    
    <form th:action="@{/produto/salvar}" th:object="${produto}" method="post">
    
    <label>Nome:</label><br>
    <input type="text" th:field="*{nome}">
    <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color: red;"></div>
    <br><br>
    
    <label>Preço:</label><br>
    <input type="number" step="0.01" th:field="*{preco}">
    <div th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}" style="color: red;"></div>
    <br><br>
    
    <label>Categoria:</label><br>
    <input type="text" th:field="*{categoria}"><br><br>
    
    <button type="submit">Salvar Produto</button>
</form>
    
    <br>
    <a href="/">Voltar para a lista</a>
</body>
</html>
